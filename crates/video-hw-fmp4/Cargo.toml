[package]
name = "video-hw-fmp4"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[features]
default = []
async-session = ["dep:tokio"]
serde = ["dep:serde"]
backend-vt = ["video-hw/backend-vt"]
backend-nvidia = ["video-hw/backend-nvidia"]
backend-intel = ["video-hw/backend-intel"]
backend-vulkan = ["video-hw/backend-vulkan"]

[dependencies]
anyhow = "1.0.101"
shiguredo_mp4 = "2026.3.0"
scuffle-h265 = "0.2.2"
video-hw = { path = "../video-hw", default-features = false }
tokio = { version = "1.50.0", features = ["rt", "sync"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
clap = { version = "4.5.59", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11"] }
serde_json = "1.0.149"
shiguredo_video_device = "2026.1.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[[example]]
name = "camera_record_fmp4_gui"
required-features = ["async-session"]
