[package]
name = "video-hw-backend-vt"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["backend-vt"]
backend-vt = [
  "dep:core-foundation",
  "dep:core-media",
  "dep:core-video",
  "dep:metal",
  "dep:video-toolbox",
]

[dependencies]
video-hw-core = { path = "../video-hw-core", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10.1", optional = true }
core-media = { version = "0.7.1", optional = true }
core-video = { version = "0.5.2", optional = true }
metal = { version = "0.33.0", optional = true }
video-toolbox = { version = "0.2.1", optional = true }
