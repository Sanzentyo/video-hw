[package]
name = "video-hw-backend-vulkan"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["backend-vulkan"]
backend-vulkan = ["video-hw-core/backend-vulkan"]
unstable-raw-inputs = ["video-hw-core/unstable-raw-inputs"]

[dependencies]
video-hw-core = { path = "../video-hw-core", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
vk-video = { version = "0.2.1" }
ash = { version = "0.38.0" }
scuffle-h265 = { version = "0.2.2" }
oxideav-av1 = "0.1.5"
