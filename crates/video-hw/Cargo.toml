[package]
name = "video-hw"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
backend-android = [
  "dep:video-hw-backend-android",
  "video-hw-backend-android/backend-android",
]
backend-android-imagereader = [
  "dep:video-hw-backend-android",
  "video-hw-backend-android/backend-android-imagereader",
]
backend-vt = [
  "dep:video-hw-backend-vt",
  "video-hw-backend-vt/backend-vt",
]
backend-nvidia = [
  "dep:video-hw-backend-nvidia",
  "video-hw-backend-nvidia/backend-nvidia",
]
backend-nvidia-d3d12 = [
  "dep:video-hw-backend-nvidia",
  "video-hw-backend-nvidia/backend-nvidia-d3d12",
]
backend-intel = [
  "dep:video-hw-backend-intel",
  "video-hw-backend-intel/backend-intel",
]
backend-vulkan = [
  "dep:video-hw-backend-vulkan",
  "video-hw-backend-vulkan/backend-vulkan",
]

[dependencies]
video-hw-core = { path = "../video-hw-core" }
video-hw-backend-android = { path = "../video-hw-backend-android", optional = true, default-features = false }
video-hw-backend-nvidia = { path = "../video-hw-backend-nvidia", optional = true, default-features = false }
video-hw-backend-intel = { path = "../video-hw-backend-intel", optional = true, default-features = false }
video-hw-backend-vulkan = { path = "../video-hw-backend-vulkan", optional = true, default-features = false }
video-hw-backend-vt = { path = "../video-hw-backend-vt", optional = true, default-features = false }

[dev-dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.59", features = ["derive"] }
rstest = "0.26.1"
criterion = "0.8.2"
shiguredo_video_device = "2026.1.0"
shiguredo_mp4 = "2026.3.0"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11"] }

[[bench]]
name = "decode_bench"
harness = false
