[package]
name = "video-hw-backend-nvidia"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["backend-nvidia"]
backend-nvidia = [
  "dep:cudarc",
  "dep:nvidia-video-codec-sdk",
  "nvidia-video-codec-sdk/cuda",
]
backend-nvidia-d3d12 = ["dep:nvidia-video-codec-sdk", "nvidia-video-codec-sdk/d3d12"]

[dependencies]
video-hw-core = { path = "../video-hw-core", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cudarc = { version = "=0.19.2", optional = true, default-features = false, features = ["driver", "nvrtc", "cuda-version-from-build-system"] }
nvidia-video-codec-sdk = { git = "https://github.com/Sanzentyo/nvidia-video-codec-sdk.git", rev = "472380cae1a7d9b11848b16ce8862cc053f02678", version = "0.4.0", optional = true, default-features = false }
